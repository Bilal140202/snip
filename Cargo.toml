[package]
name = "snipit"
version = "0.3.5"
edition = "2021"
description = "Project-scoped command snippets with built-in fuzzy finder"
license = "MIT"
repository = "https://github.com/Bilal140202/snip"
homepage = "https://github.com/Bilal140202/snip"
documentation = "https://github.com/Bilal140202/snip#readme"
readme = "README.md"
keywords = ["cli", "snippets", "commands", "fuzzy", "productivity"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.88"

# The crate is published under `snipit` because `snip` is already taken
# on crates.io (by Daniel McGraw's "Text snippets on the command line").
# The binary remains `snip` so all docs/usage stay the same.
[[bin]]
name = "snip"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { version = "0.9", optional = true }
crossterm = { version = "0.28", optional = true }
fuzzy-matcher = "0.3"
shell-words = "1"
colored = "3"
anyhow = "1"
which = "6"

[features]
default = ["detect-docker", "picker"]
detect-docker = ["serde_yaml"]
picker = ["crossterm"]

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
codegen-units = 1

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"